<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Mariage — Rose Élégant</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- PETALES DECORATION -->
  <div class="petals">
    <span>🌸</span><span>🌸</span><span>🌸</span>
    <span>🌸</span><span>🌸</span><span>🌸</span>
  </div>

  <!-- CARTE INVITATION -->
  <div class="card">

    <!-- TOP DECORATION -->
    <div class="top-decoration">
      <div class="line"></div>
      <span class="diamond">❧</span>
      <div class="line"></div>
    </div>

    <!-- ANNOUNCE -->
    <p class="announce">Nous avons l'honneur de vous annoncer</p>
    <p class="union">l'union de</p>

    <!-- NOMS -->
    <div class="names">
      <h1 class="name">Yasmine</h1>
      <span class="and">&</span>
      <h1 class="name">Karim</h1>
    </div>

    <!-- DIVIDER -->
    <div class="divider">
      <div class="line"></div>
      <span>🌸</span>
      <div class="line"></div>
    </div>

    <!-- DETAILS -->
    <div class="details">

      <div class="detail-item">
        <span class="detail-icon">📅</span>
        <div>
          <p class="detail-label">Date</p>
          <p class="detail-value">Samedi 14 Juin 2025</p>
        </div>
      </div>

      <div class="detail-item">
        <span class="detail-icon">🕖</span>
        <div>
          <p class="detail-label">Heure</p>
          <p class="detail-value">18h00</p>
        </div>
      </div>

      <div class="detail-item">
        <span class="detail-icon">📍</span>
        <div>
          <p class="detail-label">Lieu</p>
          <p class="detail-value">Salle des Roses, Tunis</p>
        </div>
      </div>

    </div>

    <!-- MESSAGE -->
    <div class="message">
      <p>❝ Votre présence sera notre plus beau cadeau ❞</p>
    </div>

    <!-- BOTTOM DECORATION -->
    <div class="top-decoration">
      <div class="line"></div>
      <span class="diamond">❧</span>
      <div class="line"></div>
    </div>

  </div>

</body>
</html>
