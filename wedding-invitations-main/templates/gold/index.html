<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Mariage — Gold Luxe</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- PARTICULES DOREES -->
  <div class="particles">
    <span>✦</span><span>✦</span><span>✦</span>
    <span>✦</span><span>✦</span><span>✦</span>
    <span>◆</span><span>◆</span>
  </div>

  <!-- CARTE -->
  <div class="card">

    <!-- COIN DECORATIONS -->
    <div class="corner top-left">❋</div>
    <div class="corner top-right">❋</div>
    <div class="corner bottom-left">❋</div>
    <div class="corner bottom-right">❋</div>

    <!-- TOP -->
    <div class="top-decoration">
      <div class="line"></div>
      <span class="crown">♛</span>
      <div class="line"></div>
    </div>

    <p class="announce">— Mariage —</p>

    <!-- NOMS -->
    <div class="names">
      <h1 class="name">Sara</h1>
      <div class="and-container">
        <div class="and-line"></div>
        <span class="and">&</span>
        <div class="and-line"></div>
      </div>
      <h1 class="name">Ahmed</h1>
    </div>

    <!-- DIVIDER -->
    <div class="divider">
      <span>✦</span>
      <span>✦</span>
      <span>✦</span>
    </div>

    <p class="invite-text">
      Nous vous invitons à célébrer<br>
      <em>le plus beau jour de notre vie</em>
    </p>

    <!-- DETAILS -->
    <div class="details">

      <div class="detail-box">
        <p class="detail-label">DATE</p>
        <p class="detail-value">Vendredi 20 Septembre 2025</p>
      </div>

      <div class="detail-separator">✦</div>

      <div class="detail-box">
        <p class="detail-label">HEURE</p>
        <p class="detail-value">19h30</p>
      </div>

      <div class="detail-separator">✦</div>

      <div class="detail-box">
        <p class="detail-label">LIEU</p>
        <p class="detail-value">Palais des Lumières, Sfax</p>
      </div>

    </div>

    <!-- MESSAGE -->
    <div class="message">
      <p>❝ Votre présence illuminera notre bonheur ❞</p>
    </div>

    <!-- BOTTOM -->
    <div class="top-decoration">
      <div class="line"></div>
      <span class="crown">♛</span>
      <div class="line"></div>
    </div>

  </div>

</body>
</html>
